<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Yellow background -->
  <rect width="256" height="256" fill="url(#favicon-gradient)"/>
  
  <!-- Camera frame (main element) -->
  <g transform="translate(80, 80)">
    <!-- Camera body -->
    <rect x="0" y="0" width="96" height="96" fill="white" stroke="white" stroke-width="4" rx="6"/>
    
    <!-- Lens circle -->
    <circle cx="48" cy="48" r="32" fill="none" stroke="#FFD700" stroke-width="4"/>
    <circle cx="48" cy="48" r="22" fill="rgba(255,215,0,0.2)"/>
    
    <!-- Flash -->
    <rect x="12" y="12" width="18" height="18" fill="#FFD700" rx="2"/>
  </g>
  
  <!-- Camera emoji overlay -->
  <text x="128" y="180" font-size="48" text-anchor="middle">📸</text>
</svg>
