<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bubble-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="yellow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#yellow-gradient)"/>
  
  <!-- Decorative background elements -->
  <circle cx="80" cy="80" r="35" fill="rgba(255,200,0,0.3)" filter="url(#bubble-shadow)"/>
  <circle cx="450" cy="450" r="45" fill="rgba(255,200,0,0.3)" filter="url(#bubble-shadow)"/>
  
  <!-- Camera Frame (Bottom Right) - With 3D effect -->
  <g transform="translate(340, 320)">
    <!-- Shadow/3D effect -->
    <rect x="4" y="4" width="150" height="150" fill="#000" opacity="0.1" rx="10"/>
    
    <!-- Main camera square -->
    <rect x="0" y="0" width="150" height="150" fill="white" stroke="white" stroke-width="8" rx="10" filter="url(#bubble-shadow)"/>
    
    <!-- Lens (circular) -->
    <circle cx="75" cy="75" r="50" fill="none" stroke="#FFD700" stroke-width="6"/>
    <circle cx="75" cy="75" r="35" fill="rgba(255,215,0,0.2)"/>
    
    <!-- Shutter indicator -->
    <circle cx="75" cy="75" r="20" fill="#FFD700" opacity="0.5"/>
    
    <!-- Flash indicator -->
    <rect x="20" y="20" width="30" height="30" fill="#FFD700" rx="4"/>
  </g>
  
  <!-- Main Text - "MOMENT" in Bubble Style -->
  <text x="256" y="130" 
    font-family="Impact, Arial Black, sans-serif" 
    font-size="76" 
    font-weight="900"
    fill="white" 
    text-anchor="middle"
    letter-spacing="1"
    filter="url(#bubble-shadow)">
    MOMENT
  </text>
  
  <!-- Text outline for bubble effect -->
  <text x="256" y="130" 
    font-family="Impact, Arial Black, sans-serif" 
    font-size="76" 
    font-weight="900"
    fill="none" 
    stroke="#333" 
    stroke-width="3"
    text-anchor="middle"
    letter-spacing="1"
    stroke-linejoin="round">
    MOMENT
  </text>
  
  <!-- Secondary Text - "CAP" highlighting -->
  <text x="256" y="220" 
    font-family="Impact, Arial Black, sans-serif" 
    font-size="74" 
    font-weight="900"
    fill="white" 
    text-anchor="middle"
    letter-spacing="3"
    filter="url(#bubble-shadow)">
    CAP
  </text>
  
  <!-- CAP outline -->
  <text x="256" y="220" 
    font-family="Impact, Arial Black, sans-serif" 
    font-size="74" 
    font-weight="900"
    fill="none" 
    stroke="#333" 
    stroke-width="4"
    text-anchor="middle"
    letter-spacing="3"
    stroke-linejoin="round">
    CAP
  </text>
  
  <!-- Camera emoji accent (top left) -->
  <text x="60" y="90" font-size="70" opacity="0.8">📸</text>
  
  <!-- Decorative bubble dots -->
  <circle cx="320" cy="280" r="10" fill="white" opacity="0.7" filter="url(#bubble-shadow)"/>
  <circle cx="350" cy="300" r="7" fill="white" opacity="0.6"/>
  <circle cx="290" cy="310" r="8" fill="white" opacity="0.6"/>
  
  <!-- Small accent bubbles around camera -->
  <circle cx="360" cy="480" r="6" fill="white" opacity="0.5"/>
  <circle cx="400" cy="490" r="5" fill="white" opacity="0.5"/>
  <circle cx="440" cy="480" r="7" fill="white" opacity="0.5"/>
</svg>
